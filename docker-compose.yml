services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: realest8_db
      POSTGRES_USER: realest8_user
      POSTGRES_PASSWORD: realest8_password
    ports:
      - "5556:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    ports:
      - "8889:8889"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://realest8_user:realest8_password@db:5432/realest8_db
      - PORT=8889
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5111,http://localhost:5173

  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    volumes:
      - ./portal:/app/portal
      - /app/portal/node_modules
    ports:
      - "5111:5111"
    depends_on:
      - backend

  website:
    build:
      context: .
      dockerfile: Dockerfile.website
    volumes:
      - ./website:/app/website
      - /app/website/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_data:
